# Образы приложений собираются bootstrap.sh внутрь docker-демона Minikube,
# поэтому imagePullPolicy: Never и тэг :dev.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-mart-app
  namespace: propdev
spec:
  replicas: 1
  selector: { matchLabels: { app: client-mart-app } }
  template:
    metadata: { labels: { app: client-mart-app, tier: api, role: sales } }
    spec:
      containers:
        - name: app
          image: client-mart-app:dev
          imagePullPolicy: Never
          env:
            - { name: MART_DB_DSN, value: "postgresql://mart:mart@client-mart-db:5432/client_mart" }
          ports: [{ containerPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: client-mart-app, namespace: propdev }
spec:
  selector: { app: client-mart-app }
  ports: [{ port: 80, targetPort: 8000 }]
