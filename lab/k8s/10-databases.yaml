# Четыре отдельных Postgres — по одной на сервис, как на диаграмме контейнеров.
# Каждая БД получает init-скрипт через ConfigMap (создаётся отдельным kustomize-merge'ем
# в bootstrap.sh: kubectl create cm <name> --from-file=seed.sql=services/<svc>/seed.sql).
# Сами Deployment-ы — здесь.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-mart-db
  namespace: propdev
spec:
  replicas: 1
  selector: { matchLabels: { app: client-mart-db } }
  template:
    metadata: { labels: { app: client-mart-db, tier: db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB,       value: client_mart }
            - { name: POSTGRES_USER,     value: mart }
            - { name: POSTGRES_PASSWORD, value: mart }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - { name: seed, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: seed
          configMap: { name: client-mart-seed }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: client-mart-db, namespace: propdev }
spec:
  selector: { app: client-mart-db }
  ports: [{ port: 5432, targetPort: 5432 }]
