# Долгоживущий под для запуска curl/jq из demo/*.sh. Имитирует «какой-то другой
# под в том же namespace» — то есть моделирует ситуацию, когда у нарушителя есть
# рабочий доступ внутрь кластера (например, скомпрометированный соседний сервис).
apiVersion: v1
kind: Pod
metadata:
  name: tester
  namespace: propdev
  labels:
    role: tester
spec:
  containers:
    - name: shell
      image: alpine:3.20
      command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null 2>&1 && sleep infinity"]
