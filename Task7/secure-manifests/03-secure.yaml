# БЕЗОПАСНАЯ версия 03-root-user-pod.yaml.
#
# Что починили:
#   - runAsUser: 0 → runAsUser: 10001 (некорневой UID);
#   - явно проставлен runAsNonRoot: true, чтобы kubelet падал, если
#     image вдруг попытается стартовать от root;
#   - остальные защиты PSA restricted на месте.
apiVersion: v1
kind: Pod
metadata:
  name: secure-non-root
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: alpine:3.20
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
